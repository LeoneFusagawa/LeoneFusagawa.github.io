<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leone Fusagawa</title>
  <link rel="stylesheet" href="style.css?v=20260606-gold-fiche">
</head>
<body>
  <section class="intro-screen" id="intro" aria-label="Ouverture du parchemin">
    <button class="parchment-trigger" id="openScroll" type="button">
      <!-- Image attendue : ./assets/images/parchemin.png -->
      <img
        class="parchment-image site-image"
        src="./assets/images/parchemin.png"
        alt="Parchemin ferme"
      >
      <span class="intro-text">Osez dérouler ce parchemin.</span>
    </button>
  </section>

  <main class="site-shell" id="siteShell" aria-hidden="true">
    <audio id="ambientMusic" src="https://sl.elysionrp.com/entree/Entree%20Tenebreuse.mp3" loop preload="auto"></audio>
    <div class="acid-ash-layer" id="acidAshLayer" aria-hidden="true"></div>

    <div class="volume-control" aria-label="Controle du volume">
      <button class="music-toggle" id="musicToggle" type="button">PAUSE</button>
      <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume de la musique">
    </div>

    <section class="hero-section" id="accueil" aria-label="Leone Fusagawa">
      <!-- Image attendue : ./assets/images/flammes-corrosives-gauche.png -->
      <!-- Image attendue : ./assets/images/flammes-corrosives-droite.png -->
      <!-- Image attendue : ./assets/images/leone-principal.png -->
      <img
        class="hero-image-echo site-image"
        src="./assets/images/leone-principal.png"
        alt=""
        aria-hidden="true"
      >
      <img
        class="hero-image site-image"
        src="./assets/images/leone-principal.png"
        alt="Leone Fusagawa"
      >
      <div class="hero-caption">
        <h1 id="heroName">Leone Fusagawa</h1>
        <p id="heroTitle">Démon de L'Acide Rang A</p>
      </div>
    </section>

    <section class="details-section" id="details" aria-label="Fiche de detail">
      <div class="section-title">
        <p>Fiche</p>
        <h2 id="detailHeadingName">Leone Fusagawa</h2>
      </div>

      <article class="demon-card">
        <dl class="demon-details">
          <div class="demon-detail-square">
            <dt>Pouvoir Sanguinaire</dt>
            <dd id="detailPower">Acide</dd>
          </div>
          <div class="demon-detail-square">
            <dt>Rang</dt>
            <dd id="detailRank">A</dd>
          </div>
          <div class="demon-detail-square">
            <dt>Sphère</dt>
            <dd id="detailSphereOcculte">Occulte</dd>
          </div>
          <div class="demon-detail-square">
            <dt>Sphère</dt>
            <dd id="detailSphereScientifique">Scientifique</dd>
          </div>
        </dl>
      </article>
    </section>

    <section class="reports-section" id="rapports" aria-label="Rapports Hebdomadaires">
      <div class="section-title">
        <p>PDF</p>
        <h2>Rapports Hebdomadaires</h2>
      </div>

      <div class="reports-grid" id="reportsGrid">
        <!-- Les rapports PDF seront charges depuis data.json. -->
      </div>

      <template id="rapportTemplate">
        <article class="rapport-card">
          <a class="rapport-link" href="#" target="_blank" rel="noreferrer"></a>
          <time class="rapport-date"></time>
        </article>
      </template>
    </section>

    <footer class="site-footer">
      <p>Leone Fusagawa</p>
    </footer>
  </main>

  <script src="script.js?v=20260606-gold-fiche-2"></script>
</body>
</html>
