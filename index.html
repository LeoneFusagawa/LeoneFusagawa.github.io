<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leone Fusagawa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="intro-screen" id="intro" aria-label="Ouverture du parchemin">
    <button class="parchment-trigger" id="openScroll" type="button">
      <!-- Image attendue : ./assets/images/parchemin.png -->
      <img
        class="parchment-image site-image"
        src="./assets/images/parchemin.png"
        alt="Parchemin ferme"
      >
      <span class="intro-text">Osez dérouler ce parchemin.</span>
    </button>
  </section>

  <main class="site-shell" id="siteShell" aria-hidden="true">
    <audio id="ambientMusic" src="./assets/music/entree-tenebreuse.mp3" loop preload="auto"></audio>

    <div class="volume-control" aria-label="Controle du volume">
      <span class="volume-label">Son</span>
      <input id="volumeSlider" type="range" min="0" max="1" step="0.01" aria-label="Volume de la musique">
      <span id="volumePercent" class="volume-percent">35%</span>
    </div>

    <section class="hero-section" id="accueil" aria-label="Leone Fusagawa">
      <!-- Image attendue : ./assets/images/leone-principal.png -->
      <img
        class="hero-image site-image"
        src="./assets/images/leone-principal.png"
        alt="Leone Fusagawa"
      >
      <div class="hero-caption">
        <h1>Leone Fusagawa</h1>
        <p>Adepte de l'Acide</p>
      </div>
    </section>

    <section class="reports-section" id="rapports" aria-label="Rapports">
      <div class="section-title">
        <p>Rapports</p>
        <h2>Rapports</h2>
      </div>

      <div class="reports-grid" id="reportsGrid">
        <!-- Les rapports seront ajoutes manuellement plus tard. -->
      </div>

      <template id="rapportTemplate">
        <article class="rapport-card">
          <h3 class="rapport-title">titre</h3>
          <p class="rapport-description">description</p>
          <a class="rapport-button" href="#">consulter</a>
        </article>
      </template>
    </section>

    <section class="laboratory-section" id="laboratoire" aria-label="Laboratoire">
      <div class="section-title">
        <p>Laboratoire</p>
        <h2>Laboratoire</h2>
      </div>

      <div class="laboratory-gallery" id="laboratoryGallery">
        <!-- Galerie vide : les images seront ajoutees dans ./assets/images/. -->
      </div>
    </section>

    <footer class="site-footer">
      <p>Leone Fusagawa</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
